# Netlify detects Next.js and applies its runtime automatically (SSR, server
# actions, route handlers, proxy). Secrets go in the Netlify UI, not here — see .env.example.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  # Next.js telemetry off in CI
  NEXT_TELEMETRY_DISABLED = "1"
